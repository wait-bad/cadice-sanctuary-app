plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.sanctuary.cadice'
    compileSdk 34

    defaultConfig {
        applicationId "com.sanctuary.cadice"
        minSdk 26
        targetSdk 34
        versionCode 14
        versionName "1.7.2"
    }

    signingConfigs {
        violetPersistent {
            def ksPath = System.getenv("VIOLET_KEYSTORE_PATH") ?: "${System.getProperty('user.home')}/.android/violet_im_signing.jks"
            def ksFile = file(ksPath)
            if (ksFile.exists()) {
                storeFile ksFile
                storePassword System.getenv("VIOLET_STORE_PASS") ?: "VioletSanctuary2026"
                keyAlias System.getenv("VIOLET_KEY_ALIAS") ?: "violet_im"
                keyPassword System.getenv("VIOLET_KEY_PASS") ?: "VioletSanctuary2026"
            }
        }
    }

    buildTypes {
        debug {
            if (signingConfigs.violetPersistent.storeFile != null) {
                signingConfig signingConfigs.violetPersistent
            }
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (signingConfigs.violetPersistent.storeFile != null) {
                signingConfig signingConfigs.violetPersistent
            }
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.activity:activity-ktx:1.8.2'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.drawerlayout:drawerlayout:1.2.0'
    implementation 'androidx.exifinterface:exifinterface:1.3.7'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
    implementation 'com.google.code.gson:gson:2.10.1'
}
