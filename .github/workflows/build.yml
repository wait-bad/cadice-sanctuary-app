name: Build Android APK

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.2

      - name: Restore Persistent Signing Keystore
        env:
          VIOLET_KEYSTORE_BASE64: ${{ secrets.VIOLET_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$VIOLET_KEYSTORE_BASE64" ]; then
            echo "$VIOLET_KEYSTORE_BASE64" | base64 -d > "${RUNNER_TEMP}/violet_im_signing.jks"
            echo "VIOLET_KEYSTORE_PATH=${RUNNER_TEMP}/violet_im_signing.jks" >> "$GITHUB_ENV"
          fi

      - name: Build Debug APK
        env:
          VIOLET_STORE_PASS: ${{ secrets.VIOLET_STORE_PASS }}
          VIOLET_KEY_ALIAS: ${{ secrets.VIOLET_KEY_ALIAS }}
          VIOLET_KEY_PASS: ${{ secrets.VIOLET_KEY_PASS }}
        run: gradle assembleDebug --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CadiceSanctuary-Debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0-${{ github.run_number }}
          name: "🌸 可黛丝小窝专属端 v1.0.0 (Build ${{ github.run_number }})"
          body: |
            ### 🌸 可黛丝的小窝专属 Android 极简端
            - 构建编号：Build ${{ github.run_number }}
            - 签名指纹：固定 SHA256 (`7F:3D:5E:5F...F3:B5`)，支持直接覆盖更新！
            - 目标设备：iQOO (OriginOS)
            - 状态：GitHub Actions 云端自动化构建成功！
            - 使用方式：首次切换固定签名需覆盖/卸载旧临时签名版一次，此后永久直接覆盖安装升级！
          files: app/build/outputs/apk/debug/app-debug.apk
